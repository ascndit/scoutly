services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scoutly_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d scoutly_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5433:5432"

volumes:
  postgres_data: